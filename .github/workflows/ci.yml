name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 20 * * 0"  # weekly eval run on main, Sunday 20:00 UTC (Monday morning AEST)

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CB_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/chops_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - run: pytest --cov --cov-report=term-missing
      - run: python -m evals --count

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  evals:
    # Runs the golden set against the real model when the key is available.
    # On PRs touching the prompt, validator, or cases; weekly on main; and on demand.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: api
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Decide whether this PR touches the LLM layer
        id: touched
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^api/(src/chops_buddy/llm/|evals/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - name: Run evals
        if: github.event_name != 'pull_request' || steps.touched.outputs.run == 'true'
        env:
          CB_LLM_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CB_LLM_API_KEY" ]; then echo "::warning::ANTHROPIC_API_KEY secret not set; evals skipped"; exit 0; fi
          python -m evals ${{ github.event_name == 'schedule' && '--write' || '' }}
      - name: Commit weekly results
        if: github.event_name == 'schedule'
        run: |
          git config user.name "chops-buddy-evals"
          git config user.email "evals@users.noreply.github.com"
          python evals/report.py
          git add evals/results README.md ../README.md
          git diff --cached --quiet || git commit -m "evals: weekly run" && git push
