[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chops-buddy"
version = "0.1.0"
description = "Practice engine, API, and LLM eval suite for Chops Buddy"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pyjwt>=2.9",
  "anthropic>=1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "pgserver>=0.1.4",
  "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chops_buddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["chops_buddy"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.pyright]
include = ["src", "tests", "evals"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
strict = ["src"]
venvPath = "."
venv = ".venv"
